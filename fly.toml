# fly.toml app configuration file generated for unofficial-ue-chatbot on 2026-05-07T13:11:26+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "unofficial-ue-chatbot"
primary_region = "ams"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8000
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpus = 1
  memory = "256mb"
  memory_mb = 256